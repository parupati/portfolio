<div class="rag-page">

  <!-- Header -->
  <div class="rag-header">
    <div class="rag-header-inner">
      <a routerLink="/" class="back-link">
        <i class='bx bx-arrow-back'></i>
        <span>Portfolio</span>
      </a>
      <div class="rag-title-group">
        <h1 class="rag-title">
          <i class='bx bx-plane-alt'></i>
          Aviation Disruption RAG
        </h1>
        <p class="rag-subtitle">2026 Iran-US Conflict — Aviation Impact Intelligence</p>
      </div>
      <div class="rag-badge">
        <span class="badge-dot"></span>
        Powered by GPT-4o + ChromaDB
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="rag-chat-container">

    <!-- Messages -->
    <div class="rag-messages" #messagesContainer>

      <div *ngFor="let msg of messages"
           class="rag-msg"
           [ngClass]="msg.role === 'user' ? 'rag-msg-user' : 'rag-msg-assistant'">
        <div class="rag-msg-avatar" *ngIf="msg.role === 'assistant'">
          <i class='bx bx-plane-alt'></i>
        </div>
        <div class="rag-msg-body">
          <div class="rag-msg-bubble">
            <!-- Loading dots -->
            <span class="typing-dots" *ngIf="msg.loading">
              <span></span><span></span><span></span>
            </span>
            <span *ngIf="!msg.loading">{{ msg.content }}</span>
          </div>
          <!-- Sources toggle -->
          <button class="sources-toggle"
                  *ngIf="msg.sources && msg.sources.length > 0"
                  (click)="toggleSources(msg)">
            <i class='bx' [ngClass]="showSources(msg) ? 'bx-chevron-up' : 'bx-chevron-down'"></i>
            {{ showSources(msg) ? 'Hide' : 'Show' }} {{ msg.sources.length }} sources
          </button>
          <div class="sources-list" *ngIf="showSources(msg) && msg.sources">
            <div class="source-item" *ngFor="let src of msg.sources; let i = index">
              <span class="source-badge">{{ src.category }}</span>
              <span class="source-text">{{ src.content }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Example questions (shown only when 1 message) -->
      <div class="examples-grid" *ngIf="messages.length === 1">
        <button class="example-btn" *ngFor="let ex of examples" (click)="askExample(ex)">
          <i class='bx bx-search-alt'></i>
          {{ ex }}
        </button>
      </div>
    </div>

    <!-- Input -->
    <div class="rag-input-area">
      <textarea
        #inputEl
        class="rag-input"
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        placeholder="Ask about airline losses, airport closures, flight disruptions..."
        rows="1"
        [disabled]="isLoading"
      ></textarea>
      <button *ngIf="!isLoading"
              class="rag-send-btn"
              (click)="sendMessage()"
              [disabled]="!inputText.trim()">
        <i class='bx bx-send'></i>
      </button>
      <button *ngIf="isLoading"
              class="rag-stop-btn"
              (click)="stopGeneration()">
        <i class='bx bx-stop'></i>
      </button>
    </div>

  </div>
</div>
